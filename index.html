<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전자기 유도 실험 - 자기장 세기에 따른 유도 기전력</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100vw;height:100vh;overflow:hidden;font-family:"Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;background:#f8f9fa;color:#212529}
body{display:flex;align-items:center;justify-content:center;padding:12px}

/* 노트북 한 화면 스크롤 방지 레이아웃 */
.app-container{width:100%;height:100%;max-width:1400px;max-height:850px;background:#ffffff;border-radius:12px;border:1px solid #e9ecef;display:flex;flex-direction:column;gap:10px;padding:16px;box-shadow:0 4px 20px rgba(0,0,0,0.06)}

/* 상단 헤더 및 통제변인 안내 */
.header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:#f1f3f5;border-radius:8px;border:1px solid #dee2e6}
.header h1{font-size:16px;color:#343a40;font-weight:700}
.info-tag{font-size:12px;color:#495057;background:#ffffff;padding:4px 10px;border-radius:12px;border:1px solid #ced4da;font-weight:600}

/* 메인 3단 레이아웃 */
.main-layout{flex:1;display:grid;grid-template-columns:250px 1fr 1.3fr;gap:12px;min-height:0}
.panel{background:#ffffff;border-radius:8px;border:1px solid #dee2e6;padding:12px;display:flex;flex-direction:column;gap:10px;overflow:hidden}

/* 1. 좌측 옵션 바 (조작변인) */
.panel-title{font-size:13px;font-weight:700;color:#212529;border-bottom:2px solid #e9ecef;padding-bottom:6px;margin-bottom:4px}
.option-group{display:flex;flex-direction:column;gap:8px}
.btn-option{width:100%;padding:10px 12px;border-radius:6px;border:1px solid #ced4da;background:#f8f9fa;color:#495057;font-weight:700;font-size:13px;cursor:pointer;transition:all 0.2s;display:flex;justify-content:space-between;align-items:center}
.btn-option:hover{border-color:#4c6ef5;background:#edf2ff}
.btn-option.active{background:#3b5bdb;border-color:#3b5bdb;color:white;box-shadow:0 2px 6px rgba(59,91,219,0.3)}
.btn-option .sub-val{font-size:11px;opacity:0.85;font-weight:normal}

.action-btn-group{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.btn-action{width:100%;padding:10px;border-radius:6px;font-weight:700;font-size:13px;cursor:pointer;border:none;transition:all 0.15s}
.btn-run{background:#2b8a3e;color:white}.btn-run:hover{background:#237032}
.btn-reset{background:#fa5252;color:white}.btn-reset:hover{background:#e03131}

/* 2. 중앙 애니메이션 씬 */
.scene-area{position:relative;flex:1;background:#f8f9fa;border-radius:6px;border:1px solid #e9ecef;display:flex;align-items:center;justify-content:center;overflow:hidden}
.coil-visual{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:130px;height:65px;border:6px solid #868e96;border-radius:14px;z-index:2;background:rgba(255,255,255,0.4);box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.coil-text{position:absolute;bottom:8px;font-size:11px;color:#495057;background:rgba(255,255,255,0.9);padding:2px 8px;border-radius:10px;border:1px solid #dee2e6;font-weight:600}

/* 자석 비주얼 */
.magnet{position:absolute;top:10%;left:50%;transform:translateX(-50%);width:34px;height:85px;border-radius:4px;border:1px solid #343a40;display:flex;flex-direction:column;font-weight:800;font-size:13px;color:white;z-index:3;box-shadow:0 4px 10px rgba(0,0,0,0.15)}
.magnet .s-pole{height:50%;background:#4c6ef5;display:flex;align-items:center;justify-content:center}
.magnet .n-pole{height:50%;background:#ff6b6b;display:flex;align-items:center;justify-content:center}

/* 3. 우측 측정기 및 그래프 창 */
.graph-title-bar{font-size:14px;font-weight:700;color:#212529;display:flex;align-items:center;gap:6px;padding-bottom:4px}
.chart-container{flex:1;position:relative;min-height:0;background:#ffffff;border-radius:6px;border:1px solid #dee2e6;padding:4px}
canvas{width:100%;height:100%;display:block}

/* 하단 결과 데이터 표 */
.table-panel{background:#ffffff;border-radius:8px;border:1px solid #dee2e6;padding:8px 12px;max-height:130px;overflow-y:auto}
table{width:100%;border-collapse:collapse;text-align:center;font-size:12px}
th{background:#f1f3f5;color:#343a40;padding:6px;border:1px solid #dee2e6;font-weight:700}
td{padding:6px;border:1px solid #e9ecef;color:#212529;font-weight:600}
.empty-row{color:#adb5bd;padding:12px;font-weight:normal}
</style>
</head>
<body>

<div class="app-container">
  <!-- 헤더 정보 -->
  <div class="header">
    <h1>⚡ 전자기 유도 실험 시뮬레이터 (자기장 세기에 따른 유도 기전력)</h1>
    <div class="info-tag">🔒 통제변인: 코일 감은 수, 자석 이동 속도, 코일 단면적 고정</div>
  </div>

  <!-- 메인 3단 레이아웃 -->
  <div class="main-layout">
    
    <!-- 1. 좌측 옵션 바 (조작변인) -->
    <div class="panel">
      <div class="panel-title">🧲 조작변인: 자기장 세기</div>
      <div class="option-group">
        <button class="btn-option" data-val="100">
          <span>약한 자석</span> <span class="sub-val">100 mT</span>
        </button>
        <button class="btn-option" data-val="200">
          <span>중간 세기 자석</span> <span class="sub-val">200 mT</span>
        </button>
        <button class="btn-option active" data-val="300">
          <span>강한 자석</span> <span class="sub-val">300 mT</span>
        </button>
      </div>

      <div class="action-btn-group">
        <button class="btn-action btn-run" id="btnRun">🚀 실험 시작</button>
        <button class="btn-action btn-reset" id="btnReset">🔄 그래프/표 초기화</button>
      </div>
    </div>

    <!-- 2. 화면 중앙: 애니메이션 씬 -->
    <div class="panel scene-area">
      <div class="coil-visual"></div>
      <div class="coil-text">단면적 $A$ / 감은 수 $N$ 고정</div>
      
      <!-- 낙하하는 자석 -->
      <div class="magnet" id="magnet">
        <div class="s-pole">S</div>
        <div class="n-pole">N</div>
      </div>
    </div>

    <!-- 3. 우측: 요청하신 그래프 창 스타일 적용 -->
    <div class="panel">
      <div class="graph-title-bar">
        <span>📈 그래프</span>
      </div>
      
      <div class="chart-container">
        <canvas id="graphCanvas"></canvas>
      </div>
    </div>

  </div>

  <!-- 하단 결과 데이터 기록 표 -->
  <div class="table-panel">
    <table>
      <thead>
        <tr>
          <th>자기장의 세기 ($B$)</th>
          <th>유도 기전력 최댓값 ($V_{\max}$)</th>
          <th>유도 기전력 최솟값 ($V_{\min}$)</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr>
          <td colspan="3" class="empty-row">실험 시작 버튼을 눌러 데이터를 측정하세요.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
// 이미지 스타일 및 수치 매핑
const magnetConfigs = {
  100: { name: '100 mT', maxV: 0.062, minV: -0.098, peakT1: 0.300, peakT2: 0.352, color: '#4c6ef5', tooltipBorder: '#4c6ef5' },
  200: { name: '200 mT', maxV: 0.125, minV: -0.215, peakT1: 0.300, peakT2: 0.352, color: '#7950f2', tooltipBorder: '#7950f2' },
  300: { name: '300 mT', maxV: 0.256, minV: -0.421, peakT1: 0.300, peakT2: 0.352, color: '#f03e3e', tooltipBorder: '#f03e3e' }
};

let currentB = 300;
let isRunning = false;
let historyData = [];

// DOM 요소
const optionBtns = document.querySelectorAll('.btn-option');
const btnRun = document.getElementById('btnRun');
const btnReset = document.getElementById('btnReset');
const magnet = document.getElementById('magnet');
const tableBody = document.getElementById('tableBody');
const canvas = document.getElementById('graphCanvas');
const ctx = canvas.getContext('2d');

optionBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    if (isRunning) return;
    optionBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentB = parseInt(btn.getAttribute('data-val'));
  });
});

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawGraph();
}

// 첨부 이미지와 완벽히 동일한 스타일의 그래프 그리기
function drawGraph() {
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  ctx.clearRect(0, 0, w, h);

  const pad = { l: 45, r: 90, t: 35, b: 35 };
  const pw = w - pad.l - pad.r;
  const ph = h - pad.t - pad.b;

  const minY = -0.5, maxY = 0.4;
  const getY = (v) => pad.t + ph * (1 - (v - minY) / (maxY - minY));
  const getX = (t) => pad.l + pw * (t / 0.6);

  // 1. 그리드 및 범례 제목
  ctx.fillStyle = '#868e96';
  ctx.font = '11px sans-serif';
  ctx.fillText('📊 [실험] 자기장 세기에 따른 유도 기전력', pad.l, 18);

  // Y축 격자 및 라벨
  ctx.strokeStyle = '#f1f3f5';
  ctx.lineWidth = 1;
  for (let v = -0.5; v <= 0.4; v += 0.1) {
    const y = getY(v);
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
    ctx.fillText(v.toFixed(1), 12, y + 4);
  }

  // X축 격자 및 라벨
  for (let t = 0; t <= 0.6; t += 0.1) {
    const x = getX(t);
    ctx.beginPath(); ctx.moveTo(x, pad.t); ctx.lineTo(x, h - pad.b); ctx.stroke();
    ctx.fillText(t.toFixed(1), x - 8, h - pad.b + 20);
  }

  // 0V 축 기준선
  ctx.strokeStyle = '#ced4da';
  ctx.beginPath(); ctx.moveTo(pad.l, getY(0)); ctx.lineTo(w - pad.r, getY(0)); ctx.stroke();

  ctx.fillText('전압 (V)', 10, pad.t - 8);
  ctx.fillText('시간 (s)', pad.l + pw / 2 - 15, h - 5);

  // 2. 우측 상단 범례 박스 (Legend Box)
  const legendX = w - pad.r + 10;
  const legendY = pad.t;
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#e9ecef';
  ctx.lineWidth = 1;
  ctx.fillRect(legendX, legendY, 70, 75);
  ctx.strokeRect(legendX, legendY, 70, 75);

  [200, 400, 800].forEach((itemB, idx) => {
    const bKey = itemB === 200 ? 100 : (itemB === 400 ? 200 : 300);
    const cfg = magnetConfigs[bKey];
    const ly = legendY + 18 + idx * 20;

    // 체크박스
    ctx.fillStyle = cfg.color;
    ctx.fillRect(legendX + 8, ly - 8, 10, 10);

    ctx.fillStyle = '#495057';
    ctx.font = '10px sans-serif';
    ctx.fillText(`${itemB}회`, legendX + 24, ly);
  });

  // 3. 곡선 데이터 및 데이터 점(Dot), Peak 툴팁 박스 구현
  historyData.forEach(item => {
    const cfg = magnetConfigs[item.b];
    const points = [];

    // 곡선 좌표 계산
    for (let i = 0; i <= 60; i++) {
      const t = (i / 60) * 0.6;
      const x = getX(t);

      const dt1 = (t - 0.300) / 0.025;
      const dt2 = (t - 0.352) / 0.025;
      const peak1 = Math.exp(-dt1 * dt1) * cfg.maxV;
      const peak2 = Math.exp(-dt2 * dt2) * cfg.minV;

      const v = peak1 + peak2;
      const y = getY(v);
      points.push({ x, y, t, v });
    }

    // 선 그리기
    ctx.strokeStyle = cfg.color;
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    points.forEach((p, idx) => {
      if (idx === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    });
    ctx.stroke();

    // 데이터 점(Dot) 표시
    ctx.fillStyle = cfg.color;
    points.forEach((p, idx) => {
      if (idx % 2 === 0) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
        ctx.fill();
      }
    });

    // Peak 1 툴팁 (최댓값)
    const p1 = points.find(p => Math.abs(p.t - cfg.peakT1) < 0.005);
    if (p1) {
      drawTooltip(p1.x, p1.y - 12, `${p1.t.toFixed(3)} s, ${p1.v.toFixed(3)} V`, cfg.tooltipBorder);
    }

    // Peak 2 툴팁 (최솟값)
    const p2 = points.find(p => Math.abs(p.t - cfg.peakT2) < 0.005);
    if (p2) {
      drawTooltip(p2.x, p2.y + 12, `${p2.t.toFixed(3)} s, ${p2.v.toFixed(3)} V`, cfg.tooltipBorder);
    }
  });
}

// 이미지 스타일 툴팁 박스 그리기 함수
function drawTooltip(x, y, text, color) {
  ctx.font = '9px monospace';
  const textWidth = ctx.measureText(text).width;
  const tw = textWidth + 8;
  const th = 14;

  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = color;
  ctx.lineWidth = 1;

  ctx.fillRect(x - tw / 2, y - th / 2, tw, th);
  ctx.strokeRect(x - tw / 2, y - th / 2, tw, th);

  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

function updateTable() {
  if (historyData.length === 0) {
    tableBody.innerHTML = `<tr><td colspan="3" class="empty-row">실험 시작 버튼을 눌러 데이터를 측정하세요.</td></tr>`;
    return;
  }

  const sorted = [...historyData].sort((a, b) => a.b - b.b);
  tableBody.innerHTML = sorted.map(d => {
    const cfg = magnetConfigs[d.b];
    return `
      <tr>
        <td><strong style="color:${cfg.color}">${cfg.name}</strong></td>
        <td>+${cfg.maxV.toFixed(3)} V</td>
        <td>${cfg.minV.toFixed(3)} V</td>
      </tr>
    `;
  }).join('');
}

function runSimulation() {
  if (isRunning) return;
  isRunning = true;

  historyData = historyData.filter(d => d.b !== currentB);
  historyData.push({ b: currentB });

  let startTime = performance.now();
  const duration = 600;

  function animate(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1);

    magnet.style.top = (10 + progress * 58) + '%';
    drawGraph();

    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      isRunning = false;
      magnet.style.top = '10%';
      updateTable();
    }
  }

  requestAnimationFrame(animate);
}

function resetAll() {
  historyData = [];
  drawGraph();
  updateTable();
}

btnRun.addEventListener('click', runSimulation);
btnReset.addEventListener('click', resetAll);
window.addEventListener('resize', resizeCanvas);

// 초기화
resizeCanvas();
</script>
</body>
</html>
